# configs/hrsid.yaml
dataset: HRSID
adapter: hrsid

data:
  root:          /mnt/data/shruti/SAR_VQA_Data/HRSID
  annotations:   HRSID_JPG/annotations/train_test2017.json   # all 5,604 images; we re-split ourselves
  image_dir:     HRSID_JPG/JPEGImages
  clean_jsonl:   /home/saishruti/Research1/Shreyank_20_credit/DataGen/sar_vqa/output/hrsid/clean.jsonl
  border_tol_px: 1          # polygon within 1 px of the tile edge -> truncated
  # HRSID Table 2: panorama prefix -> metadata. Prefixes not listed (P0137) are dropped.
  panoramas:
    - {ids: "1-40, 61-81",            sensor: Sentinel-1B, mode: S3-SM, polarization: HH, gsd: 3.0}
    - {ids: "41-60",                  sensor: Sentinel-1B, mode: S3-SM, polarization: HV, gsd: 3.0}
    - {ids: "82-104",                 sensor: TerraSAR-X,  mode: SM,    polarization: VV, gsd: 3.0}
    - {ids: "105-122",                sensor: Sentinel-1B, mode: S3-SM, polarization: VV, gsd: 3.0}
    - {ids: "123",                    sensor: TanDEM-X,    mode: HS,    polarization: HH, gsd: 1.0}
    - {ids: "124-125, 130-131",       sensor: TerraSAR-X,  mode: ST,    polarization: HH, gsd: 0.5}
    - {ids: "126-127, 132-135",       sensor: TerraSAR-X,  mode: SM,    polarization: HH, gsd: 3.0}
    - {ids: "128",                    sensor: TerraSAR-X,  mode: HS,    polarization: VV, gsd: 1.0}
    - {ids: "129, 136",               sensor: TerraSAR-X,  mode: SM,    polarization: VV, gsd: 3.0}
  split:                    # whole panoramas per split (official split leaks through 200 px tile overlap)
    manual:
      train: "124, 125, 130, 128"      # 0.5 m x3, 1 m x1
      test:  "131, 123"                # 0.5 m x1, 1 m x1
    shares: {train: 0.7, val: 0.1, test: 0.2}   # remaining (3 m) panoramas, by ship count

output:
  base_dir:    /home/saishruti/Research1/Shreyank_20_credit/DataGen/sar_vqa/output/hrsid
  facts_dir:   intermediate_facts
  reports_dir: reports
  data_dir:    data

pipeline:
  random_seed: 42
  max_qa_per_image: 22
  max_per_category: 3
  model_input_size: 512      # 800 native -> gsd_m = native x 1.5625

classes:
  Ship: {singular: ship, plural: ships}

grid_regions:
  top_left:      [0.0000, 0.0000, 0.3333, 0.3333]
  top_center:    [0.3333, 0.0000, 0.6667, 0.3333]
  top_right:     [0.6667, 0.0000, 1.0000, 0.3333]
  middle_left:   [0.0000, 0.3333, 0.3333, 0.6667]
  center:        [0.3333, 0.3333, 0.6667, 0.6667]
  middle_right:  [0.6667, 0.3333, 1.0000, 0.6667]
  bottom_left:   [0.0000, 0.6667, 0.3333, 1.0000]
  bottom_center: [0.3333, 0.6667, 0.6667, 1.0000]
  bottom_right:  [0.6667, 0.6667, 1.0000, 1.0000]

# source = sensor, so balancing (e.g. the variance cap) runs per sensor
categories_per_source:
  Sentinel-1B: &cats [object_counting, regional_vqa, comparative_spatial, region_grounding, object_relations,
                      orientation, relative_size, absolute_size, sar_comparative, sar_bbox_variance]
  TerraSAR-X:  *cats
  TanDEM-X:    *cats

reference:
  point_min_sep_px: 20
  min_length_px: 10

grounding:
  min_size: 0.08
  max_size: 0.30
  num_regions: 3
  referring: cues
  referring_sources: [Sentinel-1B, TerraSAR-X, TanDEM-X]
  longest_cue: the longest ship
  presence_over_object: 0.5

sar:
  bright_percentile: 90

sar_bbox_variance:
  num_regions: 2
  min_size: 0.10
  max_size: 0.35
  bins: [[0, 37.3, "Low"], [37.3, 125.1, "Medium"], [125.1, 1.0e+12, "High"]]   # HRSID tertiles

thresholds:
  spatial_min_count_diff: 1
  orient_margin_deg: 5
  orient_min_aspect: 1.3
  sar_min_intensity_diff: 20          # provisional: inspect section 6
  size_min_length_ratio: 1.2
  relation_min_nn2_ratio: 1.2
  relation_dir_margin_deg: 7.5
  referring_min_gap: 0.02
  size_margin_m: 3                    # one 3 m pixel
  size_bins:                          # provisional: inspect section 7
    Ship: {measure: length, bins: [[0, 50, "less than 50 m"], [50, 100, "about 50–100 m"], [100, 200, "about 100–200 m"], [200, 1.0e+9, "more than 200 m"]]}
  coverage_bins: [[0, 101, "n/a"]]    # global_quantitative not used for HRSID (inspect prints it only)

balance:
  object_counting:     {rule: zero_cap, share: 0.2}
  regional_vqa:        {rule: yes_no}
  comparative_spatial: {rule: ab}
  region_grounding:    {rule: yes_no}
  orientation:         {rule: cap_share, share: 0.35}
  relative_size:       {rule: ab}
  absolute_size:       {rule: cap_share, share: 0.4}
  sar_comparative:     {rule: ab}
  sar_bbox_variance:   {rule: cap_share, share: 0.4}      # per sensor, against Sentinel-1B open-sea "Low"
