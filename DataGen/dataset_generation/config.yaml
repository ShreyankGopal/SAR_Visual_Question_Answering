# ============================================================
# config.yaml — Central configuration for the pipeline
# ============================================================

dataset:
  train_sar_dir:   /home/saishruti/Research1/Datasets/OpenEarthMap/train/sar_images
  train_label_dir: /home/saishruti/Research1/Datasets/OpenEarthMap/train/labels
  # val has no labels — val and test are both carved from sampled train tiles
  val_sar_dir:     /home/saishruti/Research1/Datasets/OpenEarthMap/val/sar_images  # SAR only, no labels

output:
  base_dir:  /home/saishruti/Research1/Shreyank_20_credit/Minor_dataset_experiments
  reports_dir: reports
  data_dir:    data
  vis_dir:     qa_visualisations
  facts_dir:   intermediate_facts
  patches_dir: patches          # root for saved 512×512 patch TIFs

pipeline:
  sample_count: 2        # draw this many tiles from train (set null to use all)
  random_seed: 42
  patch_size: 512         # split each 1024×1024 tile into 512×512 patches (4 per tile)
  val_fraction:  0.15     # carved from sampled train tiles (no val labels exist)
  test_fraction: 0.15     # carved from sampled train tiles
  max_qa_per_image: 22    # 9 categories now — raised from 18
  visualise: true         # set false to skip QA visualisations (saves time on full runs)

# Actual mask encoding discovered during inspection (1-indexed, NOT 0-indexed)
class_map:
  1: "Bareland"
  2: "Rangeland"
  3: "Developed Space"
  4: "Road"
  5: "Tree"
  6: "Water"
  7: "Agriculture Land"
  8: "Building"

# RGB colours for visualisation
class_colors:
  1: [210, 180, 140]   # tan        — Bareland
  2: [144, 238, 144]   # light green — Rangeland
  3: [169, 169, 169]   # gray        — Developed Space
  4: [105, 105, 105]   # dark gray   — Road
  5: [ 34, 139,  34]   # forest green— Tree
  6: [ 65, 105, 225]   # royal blue  — Water
  7: [255, 215,   0]   # gold        — Agriculture Land
  8: [220,  20,  60]   # crimson     — Building

thresholds:
  present_min_proportion: 0.005   # ≥0.5% = class is "present"
  dominant_margin:        0.05    # must beat 2nd by ≥5% to be "dominant"
  concentrated_threshold: 0.40   # ≥40% in a region = "concentrated there"
  comparison_min_diff:    0.02   # ≥2% diff needed for a comparison question

# Binned percentage buckets for quantitative answers
percentage_bins:
  - [0,   5,   "less than 5%"]
  - [5,   15,  "about 5–15%"]
  - [15,  30,  "about 15–30%"]
  - [30,  50,  "about 30–50%"]
  - [50,  70,  "about 50–70%"]
  - [70,  90,  "about 70–90%"]
  - [90,  100, "more than 90%"]

# 3×3 grid region names and normalized [x1, y1, x2, y2] bboxes
# Note: x = column direction (width), y = row direction (height)
# All 9 cells are named unambiguously (no abbreviations like "top" for top_center).
grid_regions:
  top_left:      [0.0000, 0.0000, 0.3333, 0.3333]
  top_center:    [0.3333, 0.0000, 0.6667, 0.3333]
  top_right:     [0.6667, 0.0000, 1.0000, 0.3333]
  middle_left:   [0.0000, 0.3333, 0.3333, 0.6667]
  center:        [0.3333, 0.3333, 0.6667, 0.6667]
  middle_right:  [0.6667, 0.3333, 1.0000, 0.6667]
  bottom_left:   [0.0000, 0.6667, 0.3333, 1.0000]
  bottom_center: [0.3333, 0.6667, 0.6667, 1.0000]
  bottom_right:  [0.6667, 0.6667, 1.0000, 1.0000]

# ── Region Grounding configuration ─────────────────────────────────────────────
# Random free-form bounding boxes are sampled per patch instead of grid cells.
# All sizes are normalized (fraction of image dimension, 0.0–1.0).
region_grounding:
  min_size: 0.08     # minimum normalized height/width (~41px on 512px image)
  max_size: 0.30     # maximum normalized height/width (~154px on 512px image)
  num_regions: 3     # how many random regions to sample per patch

# ── Regional VQA configuration ─────────────────────────────────────────────────
# delta_fraction controls how close a cell's pixel count must be to the best
# cell's count to be "included" in the shortlist for a given class.
regional_vqa:
  delta_fraction: 0.1   # include cell if |best_count - cell_count| < delta*total_pixels

# ── SAR-facts configuration ────────────────────────────────────────────────────
# These settings control the SAR-derived features (mean_sar_response and
# bright_pixel_fraction) added in Phase 2b. Neither feature represents a
# calibrated physical quantity — they are relative SAR amplitude statistics.
sar:
  # Percentile used to define the global "bright" threshold T.
  # T is computed from the training dataset pixel distribution once,
  # then applied consistently to all images and classes.
  bright_pixel_percentile: 90

  # Minimum difference in mean_sar_response (8-bit scale, 0–255) needed to
  # generate a comparative SAR-observation question. Prevents trivial comparisons.
  sar_mean_comparison_min_diff: 5.0

  # Minimum difference in bright_pixel_fraction (0.0–1.0) needed to generate
  # a comparative bright-fraction question.
  sar_bright_fraction_min_diff: 0.05

  # Round mean_sar_response to this many decimal places in answers.
  mean_response_round_digits: 0

  # Round bright_pixel_fraction percentage (×100) to this many decimal places.
  bright_fraction_round_digits: 0

# ── SAR BBox Variance configuration ─────────────────────────────────────────────
sar_bbox_variance:
  num_regions: 2
  min_size: 0.10
  max_size: 0.35

# ── Surrounding Classes configuration ───────────────────────────────────────────
surrounding_classes:
  max_questions: 2  # As requested by the user, limit to 2 regions

