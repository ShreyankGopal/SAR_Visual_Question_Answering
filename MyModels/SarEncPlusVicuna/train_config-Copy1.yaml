# train_config.yaml
# SAR-VLM Training Configuration
#Adding sardet100k
 
data:
  train_jsonl: "/home/shruti/SAR_VQA/data/train.jsonl"
  val_jsonl: "/home/shruti/SAR_VQA/data/test.jsonl"
  data_root: "/home/shruti/SAR_VQA/data/"
  dataset_name: "openearthmap"

  train_jsonl_2: "/home/shruti/SAR_VQA/data/sardet100k_train.jsonl"
  val_jsonl_2: "/home/shruti/SAR_VQA/data/sardet100k_test.jsonl"
  data_root_2: "/home/shruti/SAR_VQA/data/"
  dataset_name_2: "sardet100k"

  val_jsonl_3: "/home/shruti/SAR_VQA/data/val.jsonl"
  data_root_3: "/home/shruti/SAR_VQA/data/"
  dataset_name_3: "openearthmap"

  sample_seed: 42
 
model:
  vicuna_path: "lmsys/vicuna-7b-v1.5"
  encoder_checkpoint: "/home/shruti/SAR_VQA/logs/mars_base_sar_encoder_only.pth"
  d_sar: 1024
  n_visual: 256
 
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
 
training:
  epochs: 3
  # Effective batch size = micro_batch_size * gradient_accumulation_steps
  # 4 * 4 = 16
  micro_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-5
  weight_decay: 0.0
  max_length: 512 # Max text sequence length
  save_dir: "/home/shruti/SAR_VQA/SAR_Visual_Question_Answering/MyModels/SarEncPlusVicuna/checkpoints/benchmarks_sardet100k"
  checkpoint_path: ""
  checkpoint_every: 50
  log_file: "/home/shruti/SAR_VQA/models/training_sardet100k.log"
 