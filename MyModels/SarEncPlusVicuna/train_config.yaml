# train_config.yaml
# SAR-VLM Training Configuration
#Adding sardet100k
 
data:
  train_jsonl: "/home/saishruti/Research1/Shreyank_20_credit/DataGen/data/train_added.jsonl"
  val_jsonl: "/home/saishruti/Research1/Shreyank_20_credit/DataGen/data/test_added.jsonl" 
  data_root: "/home/saishruti/Research1/Shreyank_20_credit/DataGen/" 
  train_jsonl_2: "/home/saishruti/Research1/Shreyank_20_credit/DataGen/sar_vqa/output/hrsid/data/train.jsonl" 
  val_jsonl_2: "/home/saishruti/Research1/Shreyank_20_credit/DataGen/sar_vqa/output/hrsid/data/val.jsonl"   
  data_root_2: "/mnt/data/shruti/SAR_VQA_Data/HRSID/"   
  train_jsonl_3: "/home/saishruti/Research1/Shreyank_20_credit/DataGen/sar_vqa/output/ogsod/data/train.jsonl"
  val_jsonl_3: "/home/saishruti/Research1/Shreyank_20_credit/DataGen/sar_vqa/output/ogsod/data/val.jsonl"   
  data_root_3: "/mnt/data/shruti/SAR_VQA_Data/OGSOD/"   
  train_jsonl_4: "/home/saishruti/Research1/Shreyank_20_credit/DataGen/sar_vqa/output/sar_aircraft/data/train.jsonl"
  val_jsonl_4: "/home/saishruti/Research1/Shreyank_20_credit/DataGen/sar_vqa/output/sar_aircraft/data/val.jsonl"   
  data_root_4: "/home/saishruti/Research1/Shreyank_20_credit/DataGen/sar_vqa/output/sar_aircraft/tiles/"   
  train_jsonl_5: "/home/saishruti/Research1/Shreyank_20_credit/DataGen/sar_vqa/output/sived/data/train.jsonl"
  val_jsonl_5: "/home/saishruti/Research1/Shreyank_20_credit/DataGen/sar_vqa/output/sived/data/val.jsonl"   
  data_root_5: "/mnt/data/shruti/SAR_VQA_Data/SIVED/"   
  train_sample_size: 50000   # cap on primary train dataset; null/omitted = use all records
  val_sample_size: null     # same, for the primary val dataset
  sample_seed: 42   # controls which records get sampled from the second dataset
 
model:
  vicuna_path: "lmsys/vicuna-7b-v1.5"
  encoder_checkpoint: "/home/saishruti/Research1/Shreyank_20_credit/MyModels/SarEncPlusVicuna/mars_base_sar_encoder_only.pth"
  d_sar: 1024
  n_visual: 256
  load_cpu: false  # If true, load Vicuna on CPU first then move to GPU (slower but uses less peak memory)
 
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

georope:
  enable: true
  bottleneck_dim: 256
  num_heads: 4
  gcc_alpha: 0.5
  gfc_hidden_dim: 64
  zero_init_output: false
  # Reference ground distance (meters) GCC calibrates every sample against.
  # Set to the finest gsd_m across your training mix (0.1 matches the
  # SIVED/FARAD records seen so far) -- adjust if a finer source is added.
  ref_gsd_m: 0.1

training:
  epochs: 3
  # Effective batch size = micro_batch_size * gradient_accumulation_steps
  # 4 * 4 = 16
  micro_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-5
  weight_decay: 0.0
  max_length: 512 # Max text sequence length
  save_dir: "/home/saishruti/Research1/Shreyank_20_credit/MyModels/SarEncPlusVicuna/GeoRoPE_CKA_Data/checkpoints/"
  log_file: "/home/saishruti/Research1/Shreyank_20_credit/MyModels/SarEncPlusVicuna/GeoRoPE_CKA_Data/training.log"
  # CKA (Centered Kernel Alignment) auxiliary loss, aligning the SAR
  # encoder's output with the LLM's penultimate-layer representation.
  # Off by default -- flip on deliberately, don't let a pull silently
  # change training behavior.
  is_CKA: True
  lambda_CKA: 0.01
